<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Contribution</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Team Contribution</h1>
    </header>
    <main style="padding: 20px; text-align: center; background: #fff; border-radius: 8px;">
        <button id="load-contributor" type="button" style="padding: 10px 20px; font: inherit; cursor: pointer;">Show Contributor</button>
        <p id="contributor-student-id" role="status" aria-live="polite" style="margin-top: 20px;"></p>
    </main>
    <footer>
        <a href="index.html">Back to Task Manager</a>
    </footer>
    <script>
        const button = document.getElementById("load-contributor");
        const output = document.getElementById("contributor-student-id");

        button.addEventListener("click", async () => {
            button.disabled = true;
            output.textContent = "Loading contributor…";
            try {
                const response = await fetch("contribution.json", { cache: "no-store" });
                if (!response.ok) throw new Error(`Request failed (${response.status}).`);
                const data = await response.json();
                if (typeof data.contributorStudentId !== "string" || !data.contributorStudentId.trim()) {
                    throw new Error("Contributor student ID is missing.");
                }
                output.textContent = `Contributor Student ID: ${data.contributorStudentId}`;
            } catch (error) {
                output.textContent = `Could not load contributor. ${error.message}`;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
